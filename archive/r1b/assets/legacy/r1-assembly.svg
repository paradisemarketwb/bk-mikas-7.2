<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="900" viewBox="0 0 1650 900"><defs><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8395a6"/><stop offset=".25" stop-color="#263849"/><stop offset=".75" stop-color="#162434"/><stop offset="1" stop-color="#718296"/></linearGradient><radialGradient id="glass"><stop stop-color="#1a3247"/><stop offset=".68" stop-color="#0c1928"/><stop offset="1" stop-color="#03070d"/></radialGradient></defs><rect width="1650" height="900" fill="#0b1421"/><text x="55" y="62" font-size="31" font-weight="700" font-family="DejaVu Sans,Arial" fill="#f3f7fb">СБОРКА R1B · КРУГЛЫЙ КОРПУС + ОТДЕЛЬНАЯ ПЛАТА</text><text x="55" y="92" font-size="18" font-family="DejaVu Sans,Arial" fill="#adbed0">Вид в разнесённом положении · параметры корпуса предварительные до замера реального модуля</text><text x="208" y="180" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" text-anchor="middle">1. ЛИЦЕВАЯ РАМКА</text><text x="535" y="180" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" text-anchor="middle">2. LCD + ESP32</text><text x="855" y="180" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" text-anchor="middle">3. ЗАДНИЙ СТАКАН</text><text x="1181" y="180" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" text-anchor="middle">4. BK-KLINE R1</text><text x="1473" y="180" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" text-anchor="middle">5. DC/DC</text><circle cx="208" cy="408" r="144" fill="url(#steel)" stroke="#8ba5b7" stroke-width="9"/><circle cx="208" cy="408" r="108" fill="#0b1421" stroke="#07111d" stroke-width="9"/><circle cx="535" cy="408" r="146" fill="#254057" stroke="#7b92a7" stroke-width="7"/><circle cx="535" cy="408" r="131" fill="url(#glass)" stroke="#121c26" stroke-width="9"/><text x="535" y="372" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="25" font-weight="700" text-anchor="middle">BK</text><text x="535" y="437" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="79" font-weight="700" text-anchor="middle">88°</text><text x="535" y="469" fill="#72d7ad" font-family="DejaVu Sans,Arial" font-size="18" font-weight="600" text-anchor="middle">ОЖ</text><ellipse cx="855" cy="408" rx="140" ry="143" fill="#35475b" stroke="#b4c4d0" stroke-width="8"/><ellipse cx="855" cy="408" rx="114" ry="117" fill="#0f1926" stroke="#566c81" stroke-width="9"/><text x="855" y="376" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="17" font-weight="500" text-anchor="middle">Кабель 12PIN</text><text x="855" y="408" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="17" font-weight="500" text-anchor="middle">на заднюю</text><text x="855" y="440" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="17" font-weight="500" text-anchor="middle">плату</text><rect x="1064" y="339" width="232" height="155" rx="17" fill="#245b63" stroke="#80d4c5" stroke-width="2"/><text x="1180" y="374" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" text-anchor="middle">L9637D</text><text x="1180" y="408" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="17" font-weight="500" text-anchor="middle">U2 / R1 / R2</text><text x="1180" y="439" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="16" font-weight="500" text-anchor="middle">C1 / C2 / C3 / JP1</text><rect x="1360" y="347" width="246" height="137" rx="17" fill="#4d4d2c" stroke="#d2c27d" stroke-width="2"/><text x="1483" y="380" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="24" font-weight="700" text-anchor="middle">12 → 5 В</text><text x="1483" y="411" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="19" font-weight="500" text-anchor="middle">защищённый</text><text x="1483" y="441" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="17" font-weight="500" text-anchor="middle">модуль питания</text><path d="M361 408 H377" stroke="#b4c3d1" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M688 408 H709" stroke="#b4c3d1" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M1004 408 H1050" stroke="#65aafa" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M1296 408 H1350" stroke="#72d7ad" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="72" y="671" width="1470" height="150" rx="18" fill="#132538" stroke="#47627d" stroke-width="2"/><text x="94" y="706" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" text-anchor="start">Размещение</text><text x="94" y="738" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Экран и интерфейс соединяются комплектным 12PIN хвостом; K-Line/ACC/GND — отдельным съёмным автомобильным жгутом.</text><text x="94" y="768" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">DC/DC лучше разместить отдельно от сенсорного стекла; кронштейн, уплотнитель и посадка зависят от места установки.</text><text x="71" y="859" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="15" font-weight="400" text-anchor="start">Печатные детали: hardware/case/gauge-r1.scad, hardware/case/adapter-r1.scad. Сначала пробная печать, затем контроль USB, шлейфа и температуры.</text></svg>