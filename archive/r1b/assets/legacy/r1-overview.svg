<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="930" viewBox="0 0 1680 930"><defs><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8395a6"/><stop offset=".25" stop-color="#263849"/><stop offset=".75" stop-color="#162434"/><stop offset="1" stop-color="#718296"/></linearGradient><radialGradient id="glass"><stop stop-color="#1a3247"/><stop offset=".68" stop-color="#0c1928"/><stop offset="1" stop-color="#03070d"/></radialGradient></defs><rect width="1680" height="930" fill="#0b1421"/><text x="55" y="62" font-size="31" font-weight="700" font-family="DejaVu Sans,Arial" fill="#f3f7fb">БК МИКАС 7.2 · СХЕМА ПОДКЛЮЧЕНИЯ</text><text x="55" y="92" font-size="18" font-family="DejaVu Sans,Arial" fill="#adbed0">Собственная аппаратная ревизия R1B · экран 2,1″ Waveshare ESP32-S3 · условные цвета нового жгута</text><rect x="58" y="160" width="360" height="330" rx="18" fill="#132538" stroke="#47627d" stroke-width="2"/><text x="80" y="195" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" text-anchor="start">УАЗ · штатная коса</text><text x="80" y="227" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Микас 7.2  /  ЗМЗ-409</text><text x="80" y="257" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Контакт 11  —  K-LINE</text><text x="80" y="287" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Контакт 12  —  МАССА</text><text x="80" y="317" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">ACC +12 В после зажигания</text><text x="80" y="347" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Штатная диагностика сохранена</text><rect x="575" y="150" width="385" height="390" rx="18" fill="#132538" stroke="#47627d" stroke-width="2"/><text x="597" y="185" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" text-anchor="start">Наша плата BK-KLINE-R1B</text><text x="597" y="217" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">U1: L9637D   SO-8</text><text x="597" y="247" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">K  → pin6      VS → pin7</text><text x="597" y="277" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">GND → pin5   VCC → pin3</text><text x="597" y="307" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">TX → pin4     RX → pin1</text><text x="597" y="337" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">U2 — аппаратный запрет TX</text><rect x="1063" y="127" width="538" height="495" rx="32" fill="#132538" stroke="#47627d" stroke-width="2"/><circle cx="1332" cy="362" r="218" fill="url(#steel)" stroke="#7a8da1" stroke-width="8"/><circle cx="1332" cy="362" r="202" fill="#060c14"/><circle cx="1332" cy="362" r="181" fill="url(#glass)" stroke="#345c75" stroke-width="12"/><path d="M1219 503 A177 177 0 1 1 1471 467" stroke="#72d7ad" stroke-width="11" fill="none" stroke-linecap="round"/><text x="1332" y="276" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="19" font-weight="700" text-anchor="middle">WAVESHARE · 2,1″</text><text x="1332" y="387" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="94" font-weight="700" text-anchor="middle">88°</text><text x="1332" y="430" fill="#72d7ad" font-family="DejaVu Sans,Arial" font-size="22" font-weight="500" text-anchor="middle">Температура ОЖ</text><text x="1229" y="485" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" text-anchor="middle">13.9 В</text><text x="1445" y="485" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" text-anchor="middle">850 rpm</text><rect x="190" y="645" width="455" height="165" rx="18" fill="#132538" stroke="#47627d" stroke-width="2"/><text x="212" y="680" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" text-anchor="start">Автомобильное питание</text><text x="212" y="712" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Предохранитель 1 А + защита</text><text x="212" y="742" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">DC/DC с автомобильной защитой</text><text x="212" y="772" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Стабилизированные +5 В → дисплей</text><text x="1043" y="674" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" text-anchor="start">J2 / Waveshare 12PIN (по надписям)</text><text x="1043" y="715" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="19" font-weight="400" text-anchor="start">VBUS +5 В   ·   GND   ·   3V3 выход</text><text x="1043" y="748" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="19" font-weight="400" text-anchor="start">TXD GPIO43 · RXD GPIO44 · IO0 EN</text><text x="1043" y="790" fill="#72dfef" font-family="DejaVu Sans,Arial" font-size="18" font-weight="400" text-anchor="start">Данные с ЭБУ идут по проводу; Wi-Fi — только к телефону</text><path d="M418 294 H490 V295 H575" stroke="#f2cf67" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="445" y="268" fill="#f2cf67" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" text-anchor="start">K</text><path d="M418 342 H514 V351 H575" stroke="#b4c3d1" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="438" y="334" fill="#b4c3d1" font-family="DejaVu Sans,Arial" font-size="18" font-weight="400" text-anchor="start">GND</text><path d="M419 401 H470 V700 H190" stroke="#f77974" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="455" y="432" fill="#f77974" font-family="DejaVu Sans,Arial" font-size="18" font-weight="400" text-anchor="start">ACC</text><path d="M645 701 V550 H734 V540" stroke="#fdb66c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="666" y="583" fill="#fdb66c" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">VS +12 В</text><path d="M645 750 H970 V579 H1070" stroke="#72d7ad" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="872" y="727" fill="#72d7ad" font-family="DejaVu Sans,Arial" font-size="18" font-weight="400" text-anchor="start">+5 В</text><path d="M960 450 H1004 V507 H1060" stroke="#c09aff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="964" y="430" fill="#c09aff" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">3V3</text><path d="M960 360 H1025 V415 H1060" stroke="#65aafa" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="985" y="347" fill="#65aafa" font-family="DejaVu Sans,Arial" font-size="18" font-weight="400" text-anchor="start">TX</text><path d="M960 404 H1045 V440 H1060" stroke="#72dfef" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="975" y="394" fill="#72dfef" font-family="DejaVu Sans,Arial" font-size="18" font-weight="400" text-anchor="start">RX</text><path d="M960 496 H1014 V535 H1060" stroke="#b4c3d1" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="970" y="488" fill="#b4c3d1" font-family="DejaVu Sans,Arial" font-size="16" font-weight="400" text-anchor="start">GND</text><rect x="56" y="845" width="1570" height="49" rx="9" fill="#1b3249" stroke="#47627d" stroke-width="2"/><text x="77" y="878" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">ВАЖНО: не подключать K-Line напрямую к GPIO. Нумерацию 12PIN и полярность проверить на конкретном модуле.</text><path d="M960 518 H991 V545 H1060" stroke="#c09aff" stroke-width="4" fill="none"/><text x="961" y="522" font-family="Arial" font-size="15" fill="#c09aff">IO0 EN</text><text x="58" y="906" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="14" font-weight="400" text-anchor="start">Концептуальный монтажный чертёж, не утверждённая для изготовления PCB. Подробные контакты: docs/WIRING.md</text></svg>