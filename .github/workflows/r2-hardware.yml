name: R2 KiCad and fabrication checks
on:
  workflow_dispatch:
  pull_request:
    paths: ["hardware/kicad/r2/**", "hardware/case/r2/**", "tools/check_r2_hardware.py", "tools/check_case_mesh.py", ".github/workflows/r2-hardware.yml"]
jobs:
  kicad:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kicad/kicad:9.0
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: ERC, DRC and connectivity
        run: |
          kicad-cli sch erc --exit-code-violations -o /tmp/ERC.txt hardware/kicad/r2/BK-KLINE-R2.kicad_sch
          kicad-cli pcb drc --exit-code-violations -o /tmp/DRC.txt hardware/kicad/r2/BK-KLINE-R2.kicad_pcb
          kicad-cli sch export netlist --format kicadxml -o hardware/kicad/r2/reports/netlist.xml hardware/kicad/r2/BK-KLINE-R2.kicad_sch
          /usr/bin/python3 tools/check_r2_hardware.py
          /usr/bin/python3 tools/check_case_mesh.py
