name: R2 firmware and LVGL simulator
on:
  workflow_dispatch:
  pull_request:
    paths: ["firmware/**", "simulator/**", "tests/**", "tools/test_firmware_host.sh", ".github/workflows/r2-firmware.yml"]
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/test_firmware_host.sh
      - run: cmake -S simulator -B build/simulator -DBK_WITH_SDL=OFF
      - run: cmake --build build/simulator -j2
      - run: ctest --test-dir build/simulator --output-on-failure
  esp32s3:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          idf.py set-target esp32s3
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: BK-R2-ESP32S3-experimental
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
