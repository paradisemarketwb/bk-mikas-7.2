name: Hunter Windows VS2026
on:
  workflow_dispatch:
  pull_request:
    paths: ["firmware/**", "simulator/**", "tests/**", ".github/workflows/hunter-windows.yml"]
  push:
    branches: [feat/hunter-reference-ui]
    paths: ["firmware/**", "simulator/**", "tests/**", ".github/workflows/hunter-windows.yml"]
jobs:
  windows:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - name: SDL2 x64 via vcpkg
        shell: pwsh
        run: vcpkg install sdl2:x64-windows
      - name: Configure Visual Studio 2026
        shell: pwsh
        run: cmake -S simulator -B build/simulator -G "Visual Studio 18 2026" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DENABLE_CUSTOM_COMPILER_FLAGS=OFF -DBK_REQUIRE_SDL=ON
      - run: cmake --build build/simulator --config Release --parallel 2
      - run: ctest --test-dir build/simulator -C Release --output-on-failure
      - name: Package executable and SDL runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows-package | Out-Null
          Copy-Item build/simulator/Release/*.exe build/windows-package/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/SDL2.dll" build/windows-package/
          Copy-Item simulator/README.md build/windows-package/
          Copy-Item simulator/profiles build/windows-package/ -Recurse
          & build/simulator/Release/bk_sim.exe --render build/windows-package
      - uses: actions/upload-artifact@v4
        with:
          name: Hunter-Windows-x64-VS2026-preview
          path: build/windows-package/
