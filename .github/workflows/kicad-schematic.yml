name: KiCad schematic R1B ERC and exports
on:
  push:
    paths:
      - "hardware/pcb/kicad/**"
      - ".github/workflows/kicad-schematic.yml"
  workflow_dispatch:
jobs:
  schematic:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kicad/kicad:9.0
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: KiCad CLI version (9.x)
        run: kicad-cli version
      - name: Export SVG and PDF
        run: |
          mkdir -p build/kicad/svg
          kicad-cli sch export svg -o build/kicad/svg/ hardware/pcb/kicad/bk-kline-r1b.kicad_sch
          kicad-cli sch export pdf -o build/kicad/bk-kline-r1b.pdf hardware/pcb/kicad/bk-kline-r1b.kicad_sch
      - name: Run full electrical rules check
        run: |
          kicad-cli sch erc --exit-code-violations -o build/kicad/ERC.txt hardware/pcb/kicad/bk-kline-r1b.kicad_sch
          cat build/kicad/ERC.txt
      - name: Export and inspect netlist
        run: |
          kicad-cli sch export netlist -o build/kicad/bk-kline-r1b.net hardware/pcb/kicad/bk-kline-r1b.kicad_sch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/kicad/bk-kline-r1b.net')
          s=p.read_text()
          assert len(s)>500, 'empty netlist'
          for name in ['U1','U2','J1','J2','J3','JP1','R1','R2','R3','C1','C2','C3']:
              assert f'(ref "{name}")' in s or f'(ref {name})' in s, name
          for signal in ['K_LINE_IN','K_TO_CHIP','TX_GATE_ENABLE','ESP_TX','ESP_RX','U1_TX','U1_RX','ACC_PROT']:
              assert signal in s, signal
          print('All 12 components and critical nets found in KiCad netlist')
          PY
      - name: Upload schematic and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BK-KLINE-R1B-KiCad-schematic-outputs
          path: build/kicad/
          retention-days: 30
