<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1000" viewBox="0 0 1750 1000"><defs><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8395a6"/><stop offset=".25" stop-color="#263849"/><stop offset=".75" stop-color="#162434"/><stop offset="1" stop-color="#718296"/></linearGradient><radialGradient id="glass"><stop stop-color="#1a3247"/><stop offset=".68" stop-color="#0c1928"/><stop offset="1" stop-color="#03070d"/></radialGradient></defs><rect width="1750" height="1000" fill="#0b1421"/><text x="55" y="62" font-size="31" font-weight="700" font-family="DejaVu Sans,Arial" fill="#f3f7fb">BK-KLINE-R1 · ЭЛЕКТРИЧЕСКИЕ СОЕДИНЕНИЯ</text><text x="55" y="92" font-size="18" font-family="DejaVu Sans,Arial" fill="#adbed0">SO-8 вид СВЕРХУ · VCC=3,3 В (не 5 В) · список цепей: hardware/pcb/NETLIST.csv</text><rect x="50" y="144" width="415" height="306" rx="18" fill="#132538" stroke="#47627d" stroke-width="2"/><text x="72" y="179" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" text-anchor="start">J1 · автомобильный жгут</text><text x="72" y="211" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">1  ACC_PROT +12 В (красный)</text><text x="72" y="241" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">2  GND (чёрный)</text><text x="72" y="271" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">3  K-Line (жёлтый)</text><text x="72" y="301" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">отвод от разъёма УАЗ 11/12</text><text x="72" y="331" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">F1 и защита — ДО входа J1</text><rect x="665" y="177" width="370" height="389" rx="25" fill="#132538" stroke="#47627d" stroke-width="2"/><text x="850" y="218" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="24" font-weight="700" text-anchor="middle">U1  L9637D   SOIC-8</text><rect x="785" y="252" width="134" height="228" rx="15" fill="#1b3249" stroke="#7ea2b9" stroke-width="2"/><path d="M837 252 Q850 273 863 252" fill="#0b1421" stroke="#7ea2b9" stroke-width="2"/><text x="730" y="305" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" text-anchor="start">1 RX</text><path d="M769 298 H785" stroke="#b4c3d1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="730" y="353" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" text-anchor="start">2 LO</text><path d="M769 346 H785" stroke="#b4c3d1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="730" y="401" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" text-anchor="start">3 VCC</text><path d="M769 394 H785" stroke="#b4c3d1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="730" y="449" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" text-anchor="start">4 TX</text><path d="M769 442 H785" stroke="#b4c3d1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="934" y="305" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" text-anchor="start">LI 8</text><path d="M919 298 H931" stroke="#b4c3d1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="934" y="353" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" text-anchor="start">VS 7</text><path d="M919 346 H931" stroke="#b4c3d1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="934" y="401" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" text-anchor="start">K 6</text><path d="M919 394 H931" stroke="#b4c3d1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="934" y="449" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" text-anchor="start">GND 5</text><path d="M919 442 H931" stroke="#b4c3d1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="852" y="347" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="23" font-weight="600" text-anchor="middle">ST</text><text x="852" y="382" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" text-anchor="middle">L9637D</text><rect x="1190" y="138" width="492" height="345" rx="18" fill="#132538" stroke="#47627d" stroke-width="2"/><text x="1212" y="173" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" text-anchor="start">J2 · Waveshare 12PIN</text><text x="1212" y="205" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">J2-1   5V_TO_LCD → VBUS</text><text x="1212" y="235" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">J2-2   GND → GND</text><text x="1212" y="265" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">J2-3   3V3_FROM_LCD → 3V3</text><text x="1212" y="295" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">J2-4   ESP_TX → GPIO43 TXD</text><text x="1212" y="325" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">J2-5   ESP_RX ← GPIO44 RXD</text><text x="1212" y="355" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Смотреть надписи на плате</text><rect x="1190" y="579" width="492" height="157" rx="18" fill="#132538" stroke="#47627d" stroke-width="2"/><text x="1212" y="614" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" text-anchor="start">J3 · DC/DC 5 В</text><text x="1212" y="646" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">J3-1  защищённые +5 В</text><text x="1212" y="676" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">J3-2  общий GND</text><text x="1212" y="706" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">DC/DC — отдельный автомобильный блок</text><rect x="50" y="572" width="416" height="180" rx="16" fill="#132538" stroke="#47627d" stroke-width="2"/><text x="74" y="611" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" text-anchor="start">JP1  ·  сервисный разрыв K</text><text x="74" y="649" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="19" font-weight="400" text-anchor="start">Размыкает только ветвь БК.</text><text x="74" y="683" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="19" font-weight="400" text-anchor="start">Штатная K-Line остаётся целой.</text><text x="74" y="717" fill="#f2cf67" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">При испытаниях JP1 = OPEN</text><path d="M465 205 H576 V346 H665" stroke="#f77974" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="492" y="190" fill="#f77974" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">ACC 12 В → VS (7)</text><path d="M465 273 H595 V442 H665" stroke="#b4c3d1" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="492" y="299" fill="#b4c3d1" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">GND → GND (5)</text><path d="M465 340 H530 V630 H466" stroke="#f2cf67" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="478" y="390" fill="#f2cf67" font-family="DejaVu Sans,Arial" font-size="19" font-weight="400" text-anchor="start">K-Line</text><path d="M466 702 H554 V395 H665" stroke="#f2cf67" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="480" y="695" fill="#f2cf67" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">JP1 → K (6)</text><path d="M1035 394 H1093 V339 H1190" stroke="#c09aff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1050" y="325" fill="#c09aff" font-family="DejaVu Sans,Arial" font-size="16" font-weight="400" text-anchor="start">3V3 → VCC(3)</text><path d="M1035 451 H1100 V393 H1190" stroke="#65aafa" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1045" y="440" fill="#65aafa" font-family="DejaVu Sans,Arial" font-size="16" font-weight="400" text-anchor="start">R1 1k → TX(4)</text><path d="M1035 268 H1120 V447 H1190" stroke="#72dfef" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1050" y="245" fill="#72dfef" font-family="DejaVu Sans,Arial" font-size="16" font-weight="400" text-anchor="start">RX(1) → R2 1k</text><path d="M1190 697 H1140 V575 H1051 V553 H1035" stroke="#72d7ad" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="1020" y="627" fill="#72d7ad" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">+5 В → LCD</text><rect x="53" y="807" width="1628" height="132" rx="18" fill="#132538" stroke="#47627d" stroke-width="2"/><text x="75" y="842" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" text-anchor="start">Развязка и условия проверки</text><text x="75" y="874" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">C1 100 нФ ≥16 В:  U1 VCC pin3 ↔ GND pin5      •      C2 100 нФ ≥50 В:  U1 VS pin7 ↔ GND pin5</text><text x="75" y="904" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">R1 и R2 — последовательные 1 кОм. Не применять старую схему R0 с 5 В и делителем.</text><text x="62" y="973" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="15" font-weight="400" text-anchor="start">Схема соединений по нетлисту (электрическая ревизия, не PCB/Gerber). Проверить форму UART, переходные процессы и boot-логи.</text></svg>