<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><rect width="1800" height="1200" fill="#0b1421"/><text x="50" y="66" font-family="DejaVu Sans,Arial" font-size="32" font-weight="700" fill="#eef4fb">BK-KLINE-R1B · НАША ЭЛЕКТРИЧЕСКАЯ СХЕМА</text><text x="50" y="100" font-family="DejaVu Sans,Arial" font-size="18" font-weight="400" fill="#adbfd1">Каждая строка — точная электрическая связь; справа — виды микросхем сверху</text><rect x="46" y="142" width="1130" height="910" rx="22" fill="#142538" stroke="#516a84" stroke-width="2"/><text x="73" y="184" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" fill="#c9d9e8">ОТКУДА / СИГНАЛ</text><text x="668" y="184" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" fill="#c9d9e8">КУДА</text><rect x="72" y="204" width="475" height="51" rx="12" fill="#23384d" stroke="#f77974" stroke-width="2"/><text x="87" y="238" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="white">ACC +12 после защиты</text><path d="M549 230 H650" stroke="#f77974" stroke-width="6"/><path d="M650 230 l-12 -8 v16 z" fill="#f77974"/><rect x="662" y="204" width="478" height="51" rx="12" fill="#23384d" stroke="#f77974" stroke-width="2"/><text x="676" y="238" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" fill="#fff">J1-1 → U1-7 VS</text><text x="80" y="284" font-family="DejaVu Sans,Arial" font-size="15" font-weight="400" fill="#acbed0">C2 100 нФ (VS↔GND)</text><rect x="72" y="295" width="475" height="51" rx="12" fill="#23384d" stroke="#b4c3d1" stroke-width="2"/><text x="87" y="329" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="white">Масса автомобиля</text><path d="M549 321 H650" stroke="#b4c3d1" stroke-width="6"/><path d="M650 321 l-12 -8 v16 z" fill="#b4c3d1"/><rect x="662" y="295" width="478" height="51" rx="12" fill="#23384d" stroke="#b4c3d1" stroke-width="2"/><text x="676" y="329" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" fill="#fff">J1-2 → U1-5 GND</text><text x="80" y="375" font-family="DejaVu Sans,Arial" font-size="15" font-weight="400" fill="#acbed0">J2-2, J3-2, U2-3, C1/C2/C3</text><rect x="72" y="386" width="475" height="51" rx="12" fill="#23384d" stroke="#f2cf67" stroke-width="2"/><text x="87" y="420" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="white">Шина K-Line</text><path d="M549 412 H650" stroke="#f2cf67" stroke-width="6"/><path d="M650 412 l-12 -8 v16 z" fill="#f2cf67"/><rect x="662" y="386" width="478" height="51" rx="12" fill="#23384d" stroke="#f2cf67" stroke-width="2"/><text x="676" y="420" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" fill="#fff">J1-3 → JP1 → U1-6 K</text><text x="80" y="466" font-family="DejaVu Sans,Arial" font-size="15" font-weight="400" fill="#acbed0">JP1 разрывает только нашу ветвь</text><rect x="72" y="477" width="475" height="51" rx="12" fill="#23384d" stroke="#c09aff" stroke-width="2"/><text x="87" y="511" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="white">3,3 В от дисплея</text><path d="M549 503 H650" stroke="#c09aff" stroke-width="6"/><path d="M650 503 l-12 -8 v16 z" fill="#c09aff"/><rect x="662" y="477" width="478" height="51" rx="12" fill="#23384d" stroke="#c09aff" stroke-width="2"/><text x="676" y="511" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" fill="#fff">J2-3 → U1-3 VCC + U2-5 VCC</text><text x="80" y="557" font-family="DejaVu Sans,Arial" font-size="15" font-weight="400" fill="#acbed0">C1 100 нФ; C3 100 нФ</text><rect x="72" y="568" width="475" height="51" rx="12" fill="#23384d" stroke="#65aafa" stroke-width="2"/><text x="87" y="602" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="white">UART передача</text><path d="M549 594 H650" stroke="#65aafa" stroke-width="6"/><path d="M650 594 l-12 -8 v16 z" fill="#65aafa"/><rect x="662" y="568" width="478" height="51" rx="12" fill="#23384d" stroke="#65aafa" stroke-width="2"/><text x="676" y="602" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" fill="#fff">J2-4 GPIO43 → R1 1k → U2-2 A</text><text x="80" y="648" font-family="DejaVu Sans,Arial" font-size="15" font-weight="400" fill="#acbed0">ROM может печатать при загрузке</text><rect x="72" y="659" width="475" height="51" rx="12" fill="#23384d" stroke="#ef9fcd" stroke-width="2"/><text x="87" y="693" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="white">Разрешение передачи</text><path d="M549 685 H650" stroke="#ef9fcd" stroke-width="6"/><path d="M650 685 l-12 -8 v16 z" fill="#ef9fcd"/><rect x="662" y="659" width="478" height="51" rx="12" fill="#23384d" stroke="#ef9fcd" stroke-width="2"/><text x="676" y="693" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" fill="#fff">J2-6 GPIO0 → U2-1 /OE</text><text x="80" y="739" font-family="DejaVu Sans,Arial" font-size="15" font-weight="400" fill="#acbed0">R3 10к→3V3, HIGH=OFF, LOW=ON</text><rect x="72" y="750" width="475" height="51" rx="12" fill="#23384d" stroke="#65aafa" stroke-width="2"/><text x="87" y="784" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="white">Выход буфера</text><path d="M549 776 H650" stroke="#65aafa" stroke-width="6"/><path d="M650 776 l-12 -8 v16 z" fill="#65aafa"/><rect x="662" y="750" width="478" height="51" rx="12" fill="#23384d" stroke="#65aafa" stroke-width="2"/><text x="676" y="784" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" fill="#fff">U2-4 Y → U1-4 TX</text><text x="80" y="830" font-family="DejaVu Sans,Arial" font-size="15" font-weight="400" fill="#acbed0">При старте U2-Y = high impedance</text><rect x="72" y="841" width="475" height="51" rx="12" fill="#23384d" stroke="#72dfef" stroke-width="2"/><text x="87" y="875" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="white">UART приём</text><path d="M549 867 H650" stroke="#72dfef" stroke-width="6"/><path d="M650 867 l-12 -8 v16 z" fill="#72dfef"/><rect x="662" y="841" width="478" height="51" rx="12" fill="#23384d" stroke="#72dfef" stroke-width="2"/><text x="676" y="875" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" fill="#fff">U1-1 RX → R2 1k → J2-5 GPIO44</text><text x="80" y="921" font-family="DejaVu Sans,Arial" font-size="15" font-weight="400" fill="#acbed0">Только 3,3 В логика</text><rect x="72" y="932" width="475" height="51" rx="12" fill="#23384d" stroke="#72d7ad" stroke-width="2"/><text x="87" y="966" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="white">Питание дисплея</text><path d="M549 958 H650" stroke="#72d7ad" stroke-width="6"/><path d="M650 958 l-12 -8 v16 z" fill="#72d7ad"/><rect x="662" y="932" width="478" height="51" rx="12" fill="#23384d" stroke="#72d7ad" stroke-width="2"/><text x="676" y="966" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" fill="#fff">J3-1 +5 В → J2-1 VBUS</text><text x="80" y="1012" font-family="DejaVu Sans,Arial" font-size="15" font-weight="400" fill="#acbed0">5 В от защищённого DC/DC</text><rect x="1202" y="145" width="540" height="500" rx="20" fill="#172a3e" stroke="#516a84" stroke-width="2"/><text x="1225" y="186" font-family="DejaVu Sans,Arial" font-size="24" font-weight="700" fill="#fff">U1 — L9637D SO-8</text><text x="1225" y="213" font-family="DejaVu Sans,Arial" font-size="16" font-weight="400" fill="#adc0d0">Номер pin1 по выемке. ВИД СВЕРХУ.</text><rect x="1355" y="265" width="204" height="312" rx="14" fill="#213c51" stroke="#83a6be" stroke-width="3"/><path d="M1420 265 Q1457 293 1494 265" stroke="#83a6be" stroke-width="3" fill="#0c1724"/><text x="1400" y="420" font-family="DejaVu Sans,Arial" font-size="24" font-weight="700" fill="#fff">L9637D</text><text x="1250" y="320" font-family="DejaVu Sans,Arial" font-size="20" font-weight="400" fill="#eef4fb">1 RX</text><path d="M1337 315 H1355" stroke="#8ba8b7" stroke-width="4"/><text x="1250" y="388" font-family="DejaVu Sans,Arial" font-size="20" font-weight="400" fill="#eef4fb">2 LO</text><path d="M1337 383 H1355" stroke="#8ba8b7" stroke-width="4"/><text x="1250" y="456" font-family="DejaVu Sans,Arial" font-size="20" font-weight="400" fill="#eef4fb">3 VCC</text><path d="M1337 451 H1355" stroke="#8ba8b7" stroke-width="4"/><text x="1250" y="524" font-family="DejaVu Sans,Arial" font-size="20" font-weight="400" fill="#eef4fb">4 TX</text><path d="M1337 519 H1355" stroke="#8ba8b7" stroke-width="4"/><text x="1585" y="320" font-family="DejaVu Sans,Arial" font-size="20" font-weight="400" fill="#eef4fb">8 LI</text><path d="M1559 315 H1575" stroke="#8ba8b7" stroke-width="4"/><text x="1585" y="388" font-family="DejaVu Sans,Arial" font-size="20" font-weight="400" fill="#eef4fb">7 VS</text><path d="M1559 383 H1575" stroke="#8ba8b7" stroke-width="4"/><text x="1585" y="456" font-family="DejaVu Sans,Arial" font-size="20" font-weight="400" fill="#eef4fb">6 K</text><path d="M1559 451 H1575" stroke="#8ba8b7" stroke-width="4"/><text x="1585" y="524" font-family="DejaVu Sans,Arial" font-size="20" font-weight="400" fill="#eef4fb">5 GND</text><path d="M1559 519 H1575" stroke="#8ba8b7" stroke-width="4"/><rect x="1202" y="671" width="540" height="380" rx="20" fill="#172a3e" stroke="#516a84" stroke-width="2"/><text x="1225" y="714" font-family="DejaVu Sans,Arial" font-size="23" font-weight="700" fill="#fff">U2 — SN74LVC1G125-Q1</text><text x="1225" y="746" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" fill="#adc0d0">3,3 В · SOT-23-5 · ВИД СВЕРХУ</text><rect x="1350" y="793" width="200" height="197" rx="14" fill="#30425b" stroke="#a3bbd0" stroke-width="3"/><text x="1362" y="823" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="#ef9fcd">1 /OE</text><text x="1362" y="881" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="#65aafa">2 A</text><text x="1362" y="953" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="#b4c3d1">3 GND</text><text x="1465" y="823" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="#c09aff">5 VCC</text><text x="1465" y="953" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="#65aafa">4 Y</text><text x="1225" y="1025" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700" fill="#ef9fcd">R3 10 kОм:  /OE → 3V3</text><rect x="46" y="1078" width="1696" height="82" rx="18" fill="#23394d" stroke="#5b7187"/><text x="65" y="1111" font-family="DejaVu Sans,Arial" font-size="17" font-weight="700" fill="#f2cf67">При старте GPIO0 HIGH → U2-Y в Z → внутренняя подтяжка L9637 TX удерживает шину неактивной.</text><text x="65" y="1141" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" fill="#f0f6fb">После готовности прошивка GPIO0 LOW разрешает TX. Кнопка BOOT = GPIO0 LOW, поэтому для сервиса разомкнуть JP1.</text><text x="50" y="1185" font-family="DejaVu Sans,Arial" font-size="15" font-weight="400" fill="#aebed0">Не окончательный KiCad/Gerber. Схему R1B проверить электрически и по осциллографу перед установкой в автомобиль.</text></svg>