<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8395a6"/><stop offset=".25" stop-color="#263849"/><stop offset=".75" stop-color="#162434"/><stop offset="1" stop-color="#718296"/></linearGradient><radialGradient id="glass"><stop stop-color="#1a3247"/><stop offset=".68" stop-color="#0c1928"/><stop offset="1" stop-color="#03070d"/></radialGradient></defs><rect width="1400" height="900" fill="#0b1421"/><text x="55" y="62" font-size="31" font-weight="700" font-family="DejaVu Sans,Arial" fill="#f3f7fb">WAVESHARE 2,1″ · ПОДКЛЮЧЕНИЕ ДИСПЛЕЯ</text><text x="55" y="92" font-size="18" font-family="DejaVu Sans,Arial" fill="#adbed0">Ревизия 2.1 / 2.1B · внешний 12PIN шлейф · ориентироваться по названиям сигналов, не цвету комплектного провода</text><circle cx="365" cy="462" r="275" fill="url(#steel)" stroke="#8395aa" stroke-width="9"/><circle cx="365" cy="462" r="251" fill="url(#glass)" stroke="#0f2435" stroke-width="15"/><text x="365" y="350" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="30" font-weight="700" text-anchor="middle">ESP32-S3</text><text x="365" y="430" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="100" font-weight="700" text-anchor="middle">88°</text><text x="365" y="476" fill="#72d7ad" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" text-anchor="middle">ОЖ</text><text x="365" y="546" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" text-anchor="middle">480 × 480</text><rect x="760" y="146" width="573" height="507" rx="18" fill="#132538" stroke="#47627d" stroke-width="2"/><text x="782" y="181" fill="#f3f7fb" font-family="DejaVu Sans,Arial" font-size="21" font-weight="700" text-anchor="start">12PIN Waveshare · только 5 сигналов</text><text x="782" y="213" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Позиция 1  ·  GND   → J2-2 (чёрный)</text><text x="782" y="243" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Позиция 2  ·  VBUS 5V  ← J2-1 (красный)</text><text x="782" y="273" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Позиция 6  ·  3V3  → J2-3 (фиолетовый)</text><text x="782" y="303" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Позиция 9  ·  TXD GPIO43  → J2-4 (синий)</text><text x="782" y="333" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Позиция 10 · RXD GPIO44  ← J2-5 (голубой)</text><text x="782" y="363" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Прочие жилы 12PIN не подключать!</text><text x="782" y="393" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Два USB-C: native USB ≠ UART USB-C</text><rect x="742" y="699" width="600" height="121" rx="16" fill="#1b3249" stroke="#47627d" stroke-width="2"/><text x="761" y="743" fill="#c09aff" font-family="DejaVu Sans,Arial" font-size="20" font-weight="700" text-anchor="start">3V3 идёт ИЗ дисплея в L9637D VCC pin3</text><text x="761" y="776" fill="#72d7ad" font-family="DejaVu Sans,Arial" font-size="19" font-weight="400" text-anchor="start">VBUS получает 5 В от защищённого DC/DC</text><text x="761" y="802" fill="#f77974" font-family="DejaVu Sans,Arial" font-size="17" font-weight="400" text-anchor="start">Не подавайте 12 В ни на один GPIO или VBUS.</text><path d="M641 285 H747 V249 H760" stroke="#b4c3d1" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M641 320 H733 V290 H760" stroke="#72d7ad" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M641 354 H720 V339 H760" stroke="#c09aff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M641 390 H710 V389 H760" stroke="#65aafa" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M641 423 H700 V439 H760" stroke="#72dfef" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="68" y="852" fill="#adbed0" font-family="DejaVu Sans,Arial" font-size="16" font-weight="400" text-anchor="start">Позиции соответствуют порядку строк официальной таблицы Waveshare, но вид шлейфа зависит от ориентации штекера.</text></svg>