<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850"><rect width="1280" height="850" fill="#f4f7fb"/><g font-family="DejaVu Sans, sans-serif" fill="#14263e"><text x="45" y="50" font-size="28" font-weight="bold">USB-KKL → ESP32-S3 USB Host · original Waveshare 2.1</text><rect x="490" y="85" width="300" height="90" rx="15" fill="#ffe2dc" stroke="#c25445"/><text x="515" y="120" font-size="22">Один внешний 5 V / 2 A</text><text x="515" y="150" font-size="17">Раздельные ветви питания</text><rect x="45" y="215" width="430" height="340" rx="15" fill="#dcecff" stroke="#3275a9"/><text x="65" y="250" font-size="22" font-weight="bold">Waveshare · разъём J9</text><rect x="795" y="215" width="440" height="340" rx="15" fill="#e1f2e9" stroke="#438b6b"/><text x="815" y="250" font-size="21" font-weight="bold">USB-A female → существующий KKL</text><text x="65" y="307" font-size="20">J9.2 — USB_5V</text><text x="65" y="357" font-size="20">J9.3 — GPIO19 / D−</text><text x="65" y="407" font-size="20">J9.4 — GPIO20 / D+</text><text x="65" y="457" font-size="20">J9.1 / 5 / 11 — GND</text><text x="65" y="510" font-size="17">Оба Type-C пустые. R2-жгут снят.</text><text x="815" y="307" font-size="20">Pin 1 — VBUS (+5 V)</text><text x="815" y="357" font-size="20">Pin 2 — D−</text><text x="815" y="407" font-size="20">Pin 3 — D+</text><text x="815" y="457" font-size="20">Pin 4 — GND</text><text x="815" y="510" font-size="17">Целевой VID 0403 / PID 6001</text><g fill="none" stroke-width="5"><path d="M550 175 V195 H455 V300" stroke="#d04e42"/><path d="M730 175 V195 H800 V300" stroke="#d04e42"/><path d="M475 350 H795" stroke="#3178bd"/><path d="M475 400 H795" stroke="#35946c"/><path d="M475 450 H795" stroke="#4a5568"/></g><text x="510" y="335" font-size="17" fill="#3178bd">D±: по 22Ω у J9, пара до 10 cm</text><text x="510" y="485" font-size="17">Общая масса с источником</text><rect x="795" y="620" width="440" height="100" rx="15" fill="#fff0ce" stroke="#b28d36"/><text x="815" y="655" font-size="20">К Микас — прежний проверенный жгут</text><text x="815" y="690" font-size="17">K-Line / GND / питание трансивера KKL</text><path d="M1015 555 V620" stroke="#b28d36" stroke-width="5"/><text x="45" y="605" font-size="20" font-weight="bold">J9.12 = GPIO0, не земля; J9.6 = 3V3, не 5V.</text><text x="45" y="650" font-size="18">5V KKL идут напрямую от источника, не через плату дисплея.</text><text x="45" y="690" font-size="18">Не соединять USB Host ESP с USB Host PC. OTG не создаёт питание.</text><text x="45" y="765" font-size="16">Источник нумерации: официальный ESP32-S3-Touch-LCD-2.1_schematic_diagram.pdf, original2.1.</text><text x="45" y="795" font-size="16">Это схема подключения по документации; физическая проверка с KKL/автомобилем не проводилась.</text></g></svg>