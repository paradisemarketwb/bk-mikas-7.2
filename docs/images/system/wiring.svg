<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#348363"/></marker></defs><rect width="100%" height="100%" fill="#f6f8f3"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="35" y="45" font-size="32" fill="#173b2c">HUNTER R2 · межплатная проводка</text><rect x="35" y="95" width="410" height="245" rx="18" fill="#e6f3eb" stroke="#348363" stroke-width="2"/><text x="51" y="127" font-size="23" fill="#173b2c">Входы BK-POWER-R2</text><text x="51" y="159" font-size="18" fill="#173b2c">ACC после зажигания → inline 2A → ACC_RAW</text><text x="51" y="187" font-size="18" fill="#173b2c">Общая масса автомобиля</text><text x="51" y="215" font-size="18" fill="#173b2c">Необязательный внешний источник5V</text><text x="51" y="243" font-size="18" fill="#173b2c">GND дополнительного5Vисточника</text><rect x="35" y="420" width="410" height="180" rx="18" fill="#e6f3eb" stroke="#348363" stroke-width="2"/><text x="51" y="452" font-size="23" fill="#173b2c">BK-POWER J2 → BK-KLINE</text><text x="51" y="484" font-size="18" fill="#173b2c">J2.1 → J1.1 : VS_PROT</text><text x="51" y="512" font-size="18" fill="#173b2c">J2.2 → J1.2 : GND</text><text x="51" y="540" font-size="18" fill="#173b2c">J2.3 → J3.1 : 5V_OUT</text><text x="51" y="568" font-size="18" fill="#173b2c">J2.4 → J3.2 : GND</text><rect x="515" y="95" width="390" height="245" rx="18" fill="#e6f3eb" stroke="#348363" stroke-width="2"/><text x="531" y="127" font-size="23" fill="#173b2c">BK-KLINE-R2</text><text x="531" y="159" font-size="18" fill="#173b2c">J1.1 VS_PROT / J1.2 GND</text><text x="531" y="187" font-size="18" fill="#173b2c">J1.3 ответвление K-Line</text><text x="531" y="215" font-size="18" fill="#173b2c">J3.1 5V / J3.2 GND</text><text x="531" y="243" font-size="18" fill="#173b2c">JP1 снят при прошивке</text><text x="531" y="271" font-size="18" fill="#173b2c">Не перерезать штатную K-Line</text><rect x="965" y="95" width="430" height="280" rx="18" fill="#e6f3eb" stroke="#348363" stroke-width="2"/><text x="981" y="127" font-size="23" fill="#173b2c">J2 интерфейса → дисплей</text><text x="981" y="159" font-size="18" fill="#173b2c">1: 5V → WaveshareJ9.2 USB_5V</text><text x="981" y="187" font-size="18" fill="#173b2c">2: GND</text><text x="981" y="215" font-size="18" fill="#173b2c">3: 3V3 от дисплея</text><text x="981" y="243" font-size="18" fill="#173b2c">4: GPIO43 / TX</text><text x="981" y="271" font-size="18" fill="#173b2c">5: GPIO44 / RX</text><text x="981" y="299" font-size="18" fill="#173b2c">6: GPIO19 / TX_ARM, native USB запрещён</text><path d="M445 210 L515 210" fill="none" stroke="#348363" stroke-width="3" marker-end="url(#arrow)"/><path d="M905 210 L965 210" fill="none" stroke="#348363" stroke-width="3" marker-end="url(#arrow)"/><path d="M445 490 L515 300" fill="none" stroke="#348363" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="450" width="880" height="195" rx="18" fill="#fff1db" stroke="#348363" stroke-width="2"/><text x="531" y="482" font-size="23" fill="#173b2c">Waveshare original2.1: два порта, U10 переключает UART автоматически</text><text x="531" y="514" font-size="18" fill="#173b2c">Работа: питание вJ9.2 USB_5V, обаType-C свободны.</text><text x="531" y="542" font-size="18" fill="#173b2c">Сервис: JP1 снят, PC → UARTType-CJ2/CH343; после снятькабель.</text><text x="531" y="570" font-size="18" fill="#173b2c">Не подавать постоянные5V вJ2: VBUS отключает внешнийUART.</text><text x="531" y="598" font-size="18" fill="#173b2c">NativeJ3.VBUS = J9.2: PC при внешних5V туда не подключать.</text><text x="35" y="820" font-size="18" fill="#173b2c">Сигналы/номера берутся из docs/wiring/harness.json; --check сверяет выводы со схемными netlist.</text><text x="35" y="855" font-size="18" fill="#173b2c">Pin 1 наших JST не означает pin 1 разъёма Waveshare. Полные схемы и номиналы — только в KiCad.</text></g></svg>