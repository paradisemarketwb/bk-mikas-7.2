<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#348363"/></marker></defs><rect width="100%" height="100%" fill="#f6f8f3"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="35" y="45" font-size="32" fill="#173b2c">HUNTER R2 · архитектура</text><rect x="35" y="95" width="310" height="160" rx="18" fill="#e6f3eb" stroke="#348363" stroke-width="2"/><text x="51" y="127" font-size="23" fill="#173b2c">Автомобиль</text><text x="51" y="159" font-size="18" fill="#173b2c">Микас 7.2 / monitor 0B</text><text x="51" y="187" font-size="18" fill="#173b2c">K-Line 9600, 8N1</text><text x="51" y="215" font-size="18" fill="#173b2c">ACC после зажигания</text><text x="51" y="243" font-size="18" fill="#173b2c">Штатная диагностика сохранена</text><rect x="405" y="95" width="460" height="160" rx="18" fill="#e6f3eb" stroke="#348363" stroke-width="2"/><text x="421" y="127" font-size="23" fill="#173b2c">Собственные платы R2</text><text x="421" y="159" font-size="18" fill="#173b2c">BK-POWER: reverse / OV / UV / 5V</text><text x="421" y="187" font-size="18" fill="#173b2c">USB ideal-diode ORing</text><text x="421" y="215" font-size="18" fill="#173b2c">BK-KLINE: L9637D / clamp / JP1</text><text x="421" y="243" font-size="18" fill="#173b2c">TX_ARM GPIO19, UART GPIO43/44</text><rect x="925" y="95" width="470" height="160" rx="18" fill="#e6f3eb" stroke="#348363" stroke-width="2"/><text x="941" y="127" font-size="23" fill="#173b2c">Waveshare ESP32-S3</text><text x="941" y="159" font-size="18" fill="#173b2c">ST7701 / CST820 / 480×480</text><text x="941" y="187" font-size="18" fill="#173b2c">RGB565 / PSRAM / PWM</text><text x="941" y="215" font-size="18" fill="#173b2c">Единая LVGL-задача</text><text x="941" y="243" font-size="18" fill="#173b2c">Native USB с ARM запрещён</text><path d="M345 165 L405 165" fill="none" stroke="#348363" stroke-width="3" marker-end="url(#arrow)"/><path d="M865 165 L925 165" fill="none" stroke="#348363" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="355" width="310" height="145" rx="18" fill="#e6f3eb" stroke="#348363" stroke-width="2"/><text x="51" y="387" font-size="23" fill="#173b2c">Протокол</text><text x="51" y="419" font-size="18" fill="#173b2c">Один worker UART</text><text x="51" y="447" font-size="18" fill="#173b2c">Эхо / checksum / таймаут</text><text x="51" y="475" font-size="18" fill="#173b2c">Только чтение / reconnect</text><rect x="405" y="355" width="460" height="145" rx="18" fill="#e6f3eb" stroke="#348363" stroke-width="2"/><text x="421" y="387" font-size="23" fill="#173b2c">Телеметрия и история</text><text x="421" y="419" font-size="18" fill="#173b2c">Снимки / состояния / возраст</text><text x="421" y="447" font-size="18" fill="#173b2c">180 точек RAM, 64 DTC-события</text><text x="421" y="475" font-size="18" fill="#173b2c">Редкая запись событий в NVS</text><rect x="925" y="355" width="470" height="145" rx="18" fill="#e6f3eb" stroke="#348363" stroke-width="2"/><text x="941" y="387" font-size="23" fill="#173b2c">Общий renderer</text><text x="941" y="419" font-size="18" fill="#173b2c">8 приборов × 8 виджетов</text><text x="941" y="447" font-size="18" fill="#173b2c">Профили JSON / NVS</text><text x="941" y="475" font-size="18" fill="#173b2c">Native simulator и ESP32</text><path d="M345 420 L405 420" fill="none" stroke="#348363" stroke-width="3" marker-end="url(#arrow)"/><path d="M865 420 L925 420" fill="none" stroke="#348363" stroke-width="3" marker-end="url(#arrow)"/><rect x="405" y="610" width="460" height="155" rx="18" fill="#e6f3eb" stroke="#348363" stroke-width="2"/><text x="421" y="642" font-size="23" fill="#173b2c">Телефон без интернета</text><text x="421" y="674" font-size="18" fill="#173b2c">WPA2 + HTTP Authentication</text><text x="421" y="702" font-size="18" fill="#173b2c">Конструктор / import / export</text><text x="421" y="730" font-size="18" fill="#173b2c">OTA: hash + ESP image / project</text><text x="421" y="758" font-size="18" fill="#173b2c">ЭБУ не принимает команды из web</text><path d="M635 500 L635 610" fill="none" stroke="#348363" stroke-width="3" marker-end="url(#arrow)"/><path d="M925 490 L865 610" fill="none" stroke="#348363" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="850" font-size="18" fill="#173b2c">Архитектура программных и электрических связей. Не заменяет схемы KiCad и аппаратные испытания.</text></g></svg>